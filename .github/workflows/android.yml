name: Build Android shell
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Build signed APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$KEYSTORE_FILE"
          gradle -p android assembleRelease -PvCode=${{ github.run_number }}
          cp android/app/build/outputs/apk/release/app-release.apk WantToPlay.apk
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "v${{ github.run_number }}" WantToPlay.apk --title "Want to Play v${{ github.run_number }}" --notes "Install once; the app itself updates automatically from the web. Only reinstall when the app tells you a shell update is available."
